# Builds the Cat Yoink .vsix, publishes it as a GitHub release and to the VS Code Marketplace.
#
#   Release:  npm version patch && git push --follow-tags
#             (the pushed tag, e.g. v1.0.3, must match package.json's version)
#   Dry run:  Actions tab > Release > Run workflow: builds the .vsix as a downloadable artifact only.
#
# The .vsix is universal: plain JS plus what the frameless cat window uses on Windows: the WebView2
# SDK files (window/lib, for both x64 and arm64; npm ci fetches them) and window/CatHost.exe, which
# scripts/build-host.js compiles from window/host.cs with the runner's .NET Framework compiler. So
# it has to be built on Windows; other platforms use a VS Code floating window instead.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and attach the .vsix
  id-token: write # `vsce publish --oidc` (Marketplace trusted publishing) needs a GitHub OIDC token

jobs:
  vsix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $want"
            exit 1
          fi

      # vsce package; its prepublish step compiles (TypeScript, and window/CatHost.exe).
      - run: npm run package

      # Without it the cat window still works, but PowerShell compiles it at every start.
      - name: Check the .vsix has the prebuilt cat window
        shell: bash
        run: unzip -l cat-yoink-*.vsix | grep -q 'extension/window/CatHost.exe'

      - name: Publish the GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" cat-yoink-*.vsix
          --repo "$GITHUB_REPOSITORY" --title "Cat Yoink $GITHUB_REF_NAME" --generate-notes

      - name: Keep the .vsix (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cat-yoink-vsix
          path: cat-yoink-*.vsix
          if-no-files-found: error

      # The same .vsix that went to the GitHub release, with the project's own vsce (package-lock.json).
      # Not on dry runs.
      - name: Publish to Marketplace
        if: github.event_name == 'push'
        shell: bash
        run: npx --no-install vsce publish --oidc --packagePath cat-yoink-*.vsix
