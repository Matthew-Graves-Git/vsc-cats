<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- A template: src/catWindow.ts fills in {{csp}} (the webview's resource origin), {{nonce}} and
       {{media}} (this folder's webview URL, so the relative links below and idle.gif resolve). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src {{csp}} data: https:; style-src {{csp}}; font-src {{csp}}; script-src 'nonce-{{nonce}}';" />
  <base href="{{media}}/" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="terminal.css" />
  <title>Cat Yoink</title>
</head>
<body>
  <div class="stage" id="stage" data-state="idle">
    <!-- One image for everything: panel.js swaps its src between Nyan, the surf intro, the cat loop and the return.
         No src yet: panel.js starts Nyan only once it knows no cat is already out. -->
    <img class="scene" id="scene" alt="" />

    <!-- Frameless window only (html.native): drag anywhere to move it; the edge zones resize it. -->
    <div class="drag" aria-hidden="true"></div>
    <div class="edges" aria-hidden="true">
      <i data-edge="n"></i><i data-edge="s"></i><i data-edge="e"></i><i data-edge="w"></i>
      <i data-edge="ne"></i><i data-edge="nw"></i><i data-edge="se"></i><i data-edge="sw"></i>
    </div>

    <button class="close" id="close" type="button" aria-label="Close" title="Close">X</button>

    <div class="top">
      <span class="counter">Yoinked <strong id="count">0</strong> <span id="catsWord">Cats</span></span>
      <span class="appeared" id="appeared"></span>
    </div>

    <div class="bottom">
      <div class="loading" id="loading">Loading cat<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
      <!-- Above YOINK! so the button sits on the same 8px margin as the top text. -->
      <div class="status" id="status"></div>
      <button class="yoink" id="yoink" type="button">YOINK!</button>
    </div>

    <!-- Bonus-cat minigame terminal (media/terminal.js). Centered in the window with an 8px margin, 80% opaque background. -->
    <section class="term" id="term" hidden aria-live="polite">
      <header class="term-bar">
        <span class="term-title" id="termTitle"></span>
        <span class="term-timer" id="termTimer"></span>
        <button class="term-close" id="termClose" type="button" aria-label="Close terminal" title="Close">X</button>
      </header>
      <div class="term-screen" id="termScreen"><span id="termOut"></span><span class="term-cursor" aria-hidden="true"></span><div class="term-options" id="termOptions"></div></div>
      <div class="term-bottom">
        <div class="term-go-row" id="termGoRow" hidden>
          <button class="term-go" id="termGo" type="button">[ GO! ]</button>
          <div class="term-gobar" aria-hidden="true"><i id="termGoBar"></i></div>
        </div>
        <label class="term-prompt" id="termPrompt" hidden><span aria-hidden="true">&gt;</span><textarea class="term-input" id="termInput" rows="1" spellcheck="false" autocomplete="off" aria-label="Your answer"></textarea></label>
        <div class="term-hint" id="termHint"></div>
      </div>
    </section>
  </div>

  <script nonce="{{nonce}}" src="host.js"></script>
  <script nonce="{{nonce}}" src="terminal.js"></script>
  <script nonce="{{nonce}}" src="panel.js"></script>
</body>
</html>
